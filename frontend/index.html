<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RecruitCopilot</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; }

  :root {
    --bg: #0a0a14;
    --violet: #7c5cff;
    --blue: #4d8dff;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.12);
    --text: #e8e8f2;
    --text-dim: #8b8ba3;
    --success: #5eead4;
    --warn: #ff8a8a;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    position: relative;
  }

  .aurora {
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  .aurora-1 { width: 500px; height: 500px; background: var(--violet); top: -150px; left: -100px; animation: float1 18s ease-in-out infinite; }
  .aurora-2 { width: 450px; height: 450px; background: var(--blue); top: 40%; right: -150px; animation: float2 22s ease-in-out infinite; }
  .aurora-3 { width: 350px; height: 350px; background: #9d5cff; bottom: -100px; left: 30%; animation: float3 20s ease-in-out infinite; }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px, 40px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px, 60px); } }
  @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, -50px); } }

  .container { max-width: 760px; margin: 0 auto; padding: 60px 24px 80px; position: relative; z-index: 1; }

  .header { text-align: center; margin-bottom: 40px; }
  .header h1 {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 34px;
    margin: 0;
    background: linear-gradient(120deg, #fff, var(--blue) 60%, var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .header .subtitle { color: var(--text-dim); font-size: 14px; margin-top: 8px; letter-spacing: 0.3px; }

  .glass-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .section-title {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .section-title.accent { color: var(--blue); }

  input[type="file"] {
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    width: 100%;
    padding: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px dashed var(--glass-border);
    border-radius: 12px;
    margin-bottom: 16px;
  }

  textarea, input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.03);
    color: var(--text);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 12px 14px;
    resize: vertical;
  }
  textarea { height: 100px; margin-bottom: 14px; }
  textarea:focus, input[type="text"]:focus { outline: none; border-color: var(--blue); }

  button {
    background: linear-gradient(120deg, var(--violet), var(--blue));
    color: white;
    border: none;
    padding: 12px 24px;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.4px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(124,92,255,0.4); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  button.secondary { background: rgba(255,255,255,0.06); border: 1px solid var(--glass-border); margin-left: 10px; }

  .result-card { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border); }

  .name-line { font-family: 'Sora', sans-serif; font-weight: 700; font-size: 22px; color: white; }
  .email-line { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; }

  .field-label {
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--blue);
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .tag {
    display: inline-block;
    background: rgba(124,92,255,0.15);
    border: 1px solid rgba(124,92,255,0.3);
    color: #d4c9ff;
    padding: 4px 12px;
    margin: 3px 4px 3px 0;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }

  .entry {
    font-size: 13px;
    line-height: 1.6;
    padding: 10px 14px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    border-left: 2px solid var(--blue);
  }
  .entry strong { color: white; }

  .loading { color: var(--text-dim); font-size: 13px; }
  .error-msg { color: var(--warn); font-size: 13px; }

  .verdict-score {
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: 40px;
    background: linear-gradient(120deg, var(--success), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .chat-log { max-height: 320px; overflow-y: auto; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: 85%; }
  .chat-msg.user { background: rgba(77,141,255,0.15); border: 1px solid rgba(77,141,255,0.3); align-self: flex-end; }
  .chat-msg.ai { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); align-self: flex-start; }

  .chat-input-row { display: flex; gap: 10px; }
  .chat-input-row input { flex: 1; }
  .chat-input-row button { padding: 12px 22px; }

  .resume-count { color: var(--text-dim); font-size: 12px; margin-bottom: 14px; }

  .question-group-label { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); margin-top: 16px; margin-bottom: 8px; }
  .question-item { font-size: 13px; line-height: 1.6; padding: 10px 14px; margin-bottom: 6px; background: rgba(255,255,255,0.03); border-radius: 10px; border-left: 2px solid var(--violet); }
</style>
</head>
<body>

<div class="aurora aurora-1"></div>
<div class="aurora aurora-2"></div>
<div class="aurora aurora-3"></div>

<div class="container">

  <div class="header">
    <h1>RecruitCopilot</h1>
    <div class="subtitle">AI-powered candidate intelligence</div>
  </div>

  <div class="glass-card">
    <div class="section-title accent">Upload Resume</div>
    <input type="file" id="resumeFile" accept="application/pdf" />
    <button onclick="parseResume()">Extract Dossier</button>
    <div id="result"></div>
  </div>

  <div class="glass-card" id="matchZone" style="display:none;">
    <div class="section-title accent">Compare Against Job Posting</div>
    <textarea id="jobDescription" placeholder="Paste job description here..."></textarea>
    <button onclick="scoreMatch()">Score Match</button>
    <button class="secondary" onclick="generateQuestions()" id="genQuestionsBtn">Generate Interview Questions</button>
    <div id="matchResult"></div>
    <div id="questionsResult"></div>
  </div>

  <div class="glass-card">
    <div class="section-title accent">Copilot Chat</div>
    <div class="resume-count" id="resumeCount">0 candidate files loaded in this session</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="Ask about your uploaded candidates..." onkeydown="if(event.key==='Enter') sendChat();" />
      <button onclick="sendChat()">Ask</button>
    </div>
  </div>

</div>

<script>
const API_BASE = 'https://recruit-copilot.onrender.com';

let uploadedCount = 0;

async function parseResume() {
  const fileInput = document.getElementById('resumeFile');
  const resultDiv = document.getElementById('result');

  if (!fileInput.files[0]) {
    resultDiv.innerHTML = "<p class='error-msg'>No file selected — attach a PDF first.</p>";
    return;
  }

  resultDiv.innerHTML = "<p class='loading'>Scanning document...</p>";

  const formData = new FormData();
  formData.append('resume', fileInput.files[0]);

  try {
    const response = await fetch(API_BASE + '/api/parse-resume', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.error) {
      resultDiv.innerHTML = `<p class="error-msg">Error: ${data.error}</p>`;
      return;
    }

    window.lastParsedResume = data;
    document.getElementById('matchZone').style.display = 'block';

    uploadedCount++;
    document.getElementById('resumeCount').textContent =
      `${uploadedCount} candidate file${uploadedCount === 1 ? '' : 's'} loaded in this session`;

    const skillTags = (data.skills || []).map(s => `<span class="tag">${s}</span>`).join('');

    resultDiv.innerHTML = `
      <div class="result-card">
        <div class="name-line">${data.name || 'Unknown'}</div>
        <div class="email-line">${data.email || 'no contact on file'}</div>
        <div class="email-line" style="margin-top:-14px;">
          ${[
            data.phone,
            data.linkedin,
            data.github,
            data.portfolio
          ].filter(Boolean).join(' &nbsp;·&nbsp; ') || ''}
        </div>

        <div class="field-label">Skills</div>
        <div>${skillTags}</div>

        <div class="field-label">Experience</div>
        ${(data.experience || []).map(e => `
          <div class="entry"><strong>${e.role}</strong> — ${e.company}<br>${e.duration}</div>
        `).join('') || '<div class="entry">No record</div>'}

        <div class="field-label">Projects</div>
        ${(data.projects || []).map(p => `
          <div class="entry"><strong>${p.title}</strong> — ${p.technologies}<br>${p.description}</div>
        `).join('') || '<div class="entry">No record</div>'}

        <div class="field-label">Education</div>
        ${(data.education || []).map(e => `
          <div class="entry"><strong>${e.degree}</strong><br>${e.institution} — ${e.year}</div>
        `).join('') || '<div class="entry">No record</div>'}
      </div>
    `;
  } catch (err) {
    resultDiv.innerHTML = `<p class="error-msg">Connection failed — is the backend running?</p>`;
  }
}

async function scoreMatch() {
  const jobDescription = document.getElementById('jobDescription').value;
  const matchDiv = document.getElementById('matchResult');

  if (!jobDescription.trim()) {
    matchDiv.innerHTML = "<p class='error-msg'>Paste a job description first.</p>";
    return;
  }

  if (!window.lastParsedResume) {
    matchDiv.innerHTML = "<p class='error-msg'>Extract a dossier first.</p>";
    return;
  }

  matchDiv.innerHTML = "<p class='loading'>Cross-referencing candidate...</p>";

  try {
    const response = await fetch(API_BASE + '/api/match-score', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        resumeData: window.lastParsedResume,
        jobDescription: jobDescription
      })
    });

    const data = await response.json();

    if (data.error) {
      matchDiv.innerHTML = `<p class="error-msg">Error: ${data.error}</p>`;
      return;
    }

    matchDiv.innerHTML = `
      <div class="result-card">
        <div class="field-label" style="margin-top:0;">Match Score</div>
        <div class="verdict-score">${data.score}/100</div>

        <div class="field-label">Strengths</div>
        ${(data.strengths || []).map(s => `<div class="entry">${s}</div>`).join('') || '<div class="entry">None noted</div>'}

        <div class="field-label">Gaps</div>
        ${(data.gaps || []).map(g => `<div class="entry">${g}</div>`).join('') || '<div class="entry">None noted</div>'}

        <div class="field-label">Assessment</div>
        <div class="entry">${data.summary || ''}</div>
      </div>
    `;
  } catch (err) {
    matchDiv.innerHTML = `<p class="error-msg">Connection failed — is the backend running?</p>`;
  }
}

async function generateQuestions() {
  const jobDescription = document.getElementById('jobDescription').value;
  const questionsDiv = document.getElementById('questionsResult');
  const btn = document.getElementById('genQuestionsBtn');

  if (!window.lastParsedResume) {
    questionsDiv.innerHTML = "<p class='error-msg'>Extract a dossier first.</p>";
    return;
  }

  btn.disabled = true;
  questionsDiv.innerHTML = "<p class='loading'>Drafting interview questions...</p>";

  try {
    const response = await fetch(API_BASE + '/api/interview-questions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        resumeData: window.lastParsedResume,
        jobDescription: jobDescription || undefined
      })
    });

    const data = await response.json();
    btn.disabled = false;

    if (data.error) {
      questionsDiv.innerHTML = `<p class="error-msg">Error: ${data.error}</p>`;
      return;
    }

    questionsDiv.innerHTML = `
      <div class="result-card">
        <div class="field-label" style="margin-top:0;">Interview Questions</div>

        <div class="question-group-label">Technical</div>
        ${(data.technical_questions || []).map(q => `<div class="question-item">${q}</div>`).join('')}

        <div class="question-group-label">Behavioral</div>
        ${(data.behavioral_questions || []).map(q => `<div class="question-item">${q}</div>`).join('')}

        <div class="question-group-label">Gap-Probing</div>
        ${(data.gap_probing_questions || []).map(q => `<div class="question-item">${q}</div>`).join('')}
      </div>
    `;
  } catch (err) {
    btn.disabled = false;
    questionsDiv.innerHTML = `<p class="error-msg">Connection failed — is the backend running?</p>`;
  }
}

async function sendChat() {
  const input = document.getElementById('chatInput');
  const question = input.value.trim();
  const chatLog = document.getElementById('chatLog');

  if (!question) return;

  chatLog.innerHTML += `<div class="chat-msg user">${question}</div>`;
  input.value = '';
  chatLog.scrollTop = chatLog.scrollHeight;

  const loadingId = 'loading-' + Date.now();
  chatLog.innerHTML += `<div class="chat-msg ai loading" id="${loadingId}">Thinking...</div>`;
  chatLog.scrollTop = chatLog.scrollHeight;

  try {
    const response = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });

    const data = await response.json();
    const loadingEl = document.getElementById(loadingId);
    loadingEl.classList.remove('loading');

    if (data.error) {
      loadingEl.textContent = `Error: ${data.error}`;
    } else {
      loadingEl.textContent = data.answer;
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  } catch (err) {
    const loadingEl = document.getElementById(loadingId);
    loadingEl.classList.remove('loading');
    loadingEl.textContent = 'Connection failed — is the backend running?';
  }
}
</script>

</body>
</html>
